name: PlayReady CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playready-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check StoreReady V3 syntax
        run: |
          node --check packages/core/src/painpoint-assurance.mjs
          node --check packages/core/src/painpoint-reporting.mjs
          node --check packages/core/src/autonomous-checkers.mjs
          node --check packages/core/src/autonomous-reporting.mjs
          node --check packages/core/src/project-assurance-v2.mjs
          node --check packages/core/src/reporting.mjs
          node --check packages/cli/bin/storeready.mjs
          node --check test/painpoint-assurance.test.mjs
          node --check test/autonomous-checkers.test.mjs

  painpoint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test test/painpoint-assurance.test.mjs test/autonomous-checkers.test.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
