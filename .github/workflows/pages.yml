name: Publish StoreReady demo

on:
  push:
    branches: [main]
    paths:
      - 'apps/releaseproof/**'
      - 'examples/releaseproof/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node apps/releaseproof/generate-demo-reports.mjs
      - run: node --test apps/releaseproof/test/*.test.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/releaseproof/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: read
    steps:
      - name: Deploy demo site
        id: deployment
        uses: actions/deploy-pages@v5
